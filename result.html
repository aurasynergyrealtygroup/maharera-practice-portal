<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your result — MahaRERA Practice Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="brand-seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#C79A3C" stroke-width="3"/><circle cx="50" cy="50" r="36" fill="none" stroke="#C79A3C" stroke-width="1"/><path d="M35 52 L45 62 L67 38" fill="none" stroke="#E4C77E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text"><strong>MahaRERA Practice</strong><span>Registered Agent Prep Portal</span></span>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logoutBtn" class="nav-cta">Sign out</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="result-hero" id="resultHero">
    <p>Loading your result…</p>
  </div>

  <div class="card" style="max-width:640px;margin:0 auto 40px;" id="resultDetail"></div>

  <div class="panel" id="reviewPanel" style="max-width:820px;margin:0 auto 40px;display:none;">
    <div class="panel-head"><h2>Review your answers</h2></div>
    <div class="review-legend">
      <span><i class="legend-dot legend-blue"></i>Your answer</span>
      <span><i class="legend-dot legend-green"></i>Correct answer</span>
      <span><i class="legend-dot legend-red"></i>Wrong answer</span>
    </div>
    <div class="form-msg error" id="reviewError" style="display:none;"></div>
    <div id="reviewList"><p class="small">Loading review…</p></div>
  </div>

  <div class="text-center" style="margin-bottom:60px;">
    <a href="dashboard.html" class="btn btn-outline">Back to dashboard</a>
    <a href="exam.html" class="btn btn-primary" id="retakeBtn" style="margin-left:12px;">Retake test</a>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  requireAuth();
  document.getElementById("logoutBtn").addEventListener("click", () => { clearSession(); window.location.href = "login.html"; });

  const params = new URLSearchParams(window.location.search);
  const examId = params.get("examId");
  const hero = document.getElementById("resultHero");
  const detail = document.getElementById("resultDetail");

  if (!examId) {
    hero.innerHTML = '<p>No result specified. <a href="dashboard.html">Return to dashboard</a>.</p>';
    return;
  }

  try {
    const r = await api("getResult", { examId });
    const pass = r.result === "PASS";

    hero.innerHTML = `
      <svg class="result-badge" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="${pass ? '#1E7A46' : '#B23A32'}" stroke-width="3"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="${pass ? '#1E7A46' : '#B23A32'}" stroke-width="1" stroke-dasharray="2 5"/>
        ${pass
          ? '<path d="M32 52 L44 64 L70 36" fill="none" stroke="#1E7A46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>'
          : '<path d="M36 36 L64 64 M64 36 L36 64" fill="none" stroke="#B23A32" stroke-width="7" stroke-linecap="round"/>'}
      </svg>
      <div class="result-status ${pass ? 'pass' : 'fail'}">${pass ? 'Passed' : 'Not yet — keep practising'}</div>
      <p style="max-width:420px;margin:0 auto;">${pass ? 'You cleared the pass mark of ' + CONFIG.PASS_MARKS + '/100. Well prepared.' : 'You scored below the pass mark of ' + CONFIG.PASS_MARKS + '/100. Review your weak areas and try again.'}</p>
      <div class="result-grid">
        <div class="cell"><div class="num">${r.score}</div><div class="lab">Marks / 100</div></div>
        <div class="cell"><div class="num">${r.correct}</div><div class="lab">Correct</div></div>
        <div class="cell"><div class="num">${r.wrong}</div><div class="lab">Wrong</div></div>
        <div class="cell"><div class="num">${r.attemptNumber} / ${CONFIG.MAX_ATTEMPTS}</div><div class="lab">Attempt</div></div>
      </div>
    `;

    detail.innerHTML = `
      <table class="ledger">
        <tbody>
          <tr><td>Exam ID</td><td style="font-family:var(--mono)">${r.examId}</td></tr>
          <tr><td>Date</td><td>${formatDate(r.date)}</td></tr>
          <tr><td>Percentage</td><td>${r.score}%</td></tr>
          <tr><td>Time taken</td><td>${r.timeTakenMinutes} minutes</td></tr>
        </tbody>
      </table>
    `;

    if (r.attemptNumber >= CONFIG.MAX_ATTEMPTS) {
      document.getElementById("retakeBtn").style.display = "none";
    }

    renderReview(examId);
  } catch (err) {
    hero.innerHTML = `<div class="form-msg error" style="display:block;max-width:480px;margin:0 auto;">${err.message}</div>`;
  }
});

// Pulls the full question-by-question breakdown for this attempt (question text,
// the four options in both languages, what the user picked, and the correct
// answer) and renders each one with the correct option highlighted green and
// any wrong pick highlighted red, so the user can see exactly what they missed.
async function renderReview(examId) {
  const panel = document.getElementById("reviewPanel");
  const listEl = document.getElementById("reviewList");
  const errEl = document.getElementById("reviewError");
  panel.style.display = "block";

  try {
    const rev = await api("getReview", { examId });
    listEl.innerHTML = "";

    if (!rev.items || rev.items.length === 0) {
      listEl.innerHTML = '<p class="small">No question data available for this attempt.</p>';
      return;
    }

    rev.items.forEach((item, i) => {
      const wrap = document.createElement("div");
      wrap.className = "review-item";

      let statusTag;
      if (!item.submittedAnswer) {
        statusTag = '<span class="tag grey">Not answered</span>';
      } else if (item.isCorrect) {
        statusTag = '<span class="tag green">Correct</span>';
      } else {
        statusTag = '<span class="tag red">Incorrect</span>';
      }

      let optsHtml = "";
      ["A", "B", "C", "D"].forEach(letter => {
        const enText = item["option" + letter] || "";
        const mrText = item["option" + letter + "Mr"];
        const isYourAnswer = letter === item.submittedAnswer;
        const isCorrectAnswer = letter === item.correctAnswer;

        // Three independent signals, all shown at once rather than one hiding another:
        // - green fill  = this is the correct answer
        // - red fill    = this is what you picked, and it was wrong
        // - blue outline + "Your answer" tag = this is what you picked, whether right or wrong
        let cls = "review-option";
        if (isCorrectAnswer) cls += " correct";
        else if (isYourAnswer) cls += " incorrect";
        if (isYourAnswer) cls += " your-answer";

        optsHtml += `
          <div class="${cls}">
            <span class="opt-letter">${letter}</span>
            <span class="opt-text">${escapeHtml(enText)}${mrText ? `<br><span class="opt-mr">${escapeHtml(mrText)}</span>` : ""}</span>
            ${isYourAnswer ? '<span class="your-answer-tag">Your answer</span>' : ""}
          </div>`;
      });

      wrap.innerHTML = `
        <div class="review-q-head">
          <span class="review-q-num">Question ${i + 1}</span>
          ${statusTag}
        </div>
        <div class="review-q-text">
          ${escapeHtml(item.question)}
          ${item.questionMr ? `<div class="q-text-mr">${escapeHtml(item.questionMr)}</div>` : ""}
        </div>
        <div class="review-options">${optsHtml}</div>
      `;
      listEl.appendChild(wrap);
    });
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    listEl.innerHTML = "";
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}
</script>
</body>
</html>
